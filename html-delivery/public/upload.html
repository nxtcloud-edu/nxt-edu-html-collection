<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/assets/theme.js"></script>
<link rel="icon" href="/assets/nxtcloud-logo.png?v=2">
<title>내 콘텐츠 업로드 · AI 콘텐츠 갤러리</title>
<style>
  :root { color-scheme: dark; --bg: #090a12; --panel: #171a2f; --line: #3a3e5b; --text: #f4f6ff; --muted: #9ca3bd; --cyan: #00d2ff; --pink: #e94560; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0, #22284d 0, var(--bg) 55%); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  main { width: min(92vw, 560px); margin: 0 auto; padding: calc(var(--sp-8) + var(--sp-2)) 0 calc(var(--sp-8) + var(--sp-8)); }
  .back { display: inline-flex; align-items: center; min-height: 44px; padding: var(--sp-2) 0; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--cyan); }
  .panel { padding: clamp(var(--sp-6), 6vw, calc(var(--sp-8) + var(--sp-3))); border: 1px solid var(--line); background: rgba(23,26,47,.96); box-shadow: 10px 10px 0 rgba(0,0,0,.28); }
  .eyebrow { margin: 0 0 var(--sp-2); color: var(--cyan); font-size: 12px; letter-spacing: .12em; }
  h1 { margin: 0; font-size: clamp(30px, 7vw, 44px); letter-spacing: -.06em; }
  .intro { margin: var(--sp-4) 0 var(--sp-6); color: var(--muted); line-height: 1.7; }
  label { display: block; margin: var(--sp-4) 0 var(--sp-2); font-weight: 700; }
  select, input { width: 100%; min-height: 46px; padding: var(--sp-3); border: 1px solid #555b78; border-radius: 0; background: #0e101d; color: var(--text); font: inherit; }
  select:focus, input:focus { outline: 2px solid var(--cyan); outline-offset: 2px; }
  input[type="file"] { padding: var(--sp-2); }
  button { min-height: 46px; margin-top: var(--sp-6); padding: var(--sp-3) var(--sp-6); border: 0; background: var(--pink); color: #fff; cursor: pointer; font: inherit; font-weight: 800; }
  button:hover { background: #ff5b75; }
  button:disabled { cursor: wait; opacity: .55; }
  #result { margin-top: var(--sp-6); padding: var(--sp-4); border: 1px solid var(--cyan); line-height: 1.65; overflow-wrap: anywhere; }
  #result a { color: var(--cyan); }
  #result button { display: block; margin-top: var(--sp-3); background: #27304d; }
  [hidden] { display: none; }
  .error { border-color: var(--pink) !important; color: #ff9aae; }
  .hint { margin: var(--sp-2) 0 0; color: #747c99; font-size: 12px; }
  .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); margin: var(--sp-6) 0; }
  .mode-switch button { margin: 0; border: 1px solid var(--line); background: #0e101d; color: var(--muted); }
  .mode-switch button[aria-selected="true"] { border-color: var(--cyan); color: var(--text); background: #122535; }
</style>
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body><span class="grid-twinkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
<nav class="site-nav"><a class="site-brand" href="/"><img class="brand-logo" src="/assets/nxtcloud-logo.png?v=2" alt="NXT Cloud"><span class="site-brand-label">AI CONTENT GALLERY</span></a><div class="site-tools"><button class="theme-toggle" type="button" data-theme-toggle>🌙 다크</button></div></nav>
<main>
  <section class="panel" aria-labelledby="upload-title">
    <p class="eyebrow">PUBLISH YOUR CONTENT</p>
    <h1 id="upload-title">내 콘텐츠 업로드</h1>
    <p class="intro">수업과 이름 또는 팀을 확인하고, AI와 함께 만든 HTML 콘텐츠를 세상에 공개해 보세요.</p>
    <a class="back" href="/">← 갤러리로 돌아가기</a>
    <div class="mode-switch" role="tablist" aria-label="업로드 방식"><button id="createModeButton" type="button" role="tab" aria-selected="true">새 콘텐츠 만들기</button><button id="versionModeButton" type="button" role="tab" aria-selected="false">기존 콘텐츠 새 버전</button></div>
    <form id="createForm">
      <label for="cohortId">소속(수업)</label>
      <select id="cohortId" name="cohortId" required disabled>
        <option value="">수업 목록을 불러오는 중...</option>
      </select>
      <label for="contentType">분류</label>
      <select id="contentType" name="contentType" required>
        <option value="">분류를 선택하세요</option>
        <option value="webpage">웹페이지</option>
        <option value="game">미니게임</option>
      </select>
      <label id="nameLabel" for="ownerName">이름</label>
      <input id="ownerName" name="ownerName" maxlength="40" autocomplete="name" required>
      <select id="team" name="ownerName" hidden disabled>
        <option value="">팀을 선택하세요</option>
      </select>
      <label for="title">콘텐츠 제목</label>
      <input id="title" name="title" maxlength="60" placeholder="예: 박스 피하기 리믹스" required>
      <label for="password">소유 비밀번호</label>
      <input id="password" name="password" type="password" minlength="4" maxlength="30" autocomplete="new-password" required>
      <p class="hint">이 제출은 항상 새 콘텐츠를 만듭니다. 이후 업데이트는 콘텐츠 페이지의 “파일 업데이트”를 사용하세요.</p>
      <label for="file">HTML 파일</label>
      <input id="file" name="file" type="file" accept=".html,text/html" required>
      <p class="hint">HTML 파일 1개 · 최대 1MB</p>
      <button id="createSubmitButton" type="submit" disabled>새 콘텐츠 만들기</button>
    </form>
    <form id="versionForm" hidden>
      <label for="versionContentId">콘텐츠 ID</label>
      <input id="versionContentId" name="contentId" pattern="[0-9a-f]{8}" maxlength="8" placeholder="예: a1b2c3d4" required>
      <p class="hint">콘텐츠 페이지 주소의 <code>?id=</code> 뒤 8자리 값입니다.</p>
      <label for="versionPassword">소유 비밀번호</label>
      <input id="versionPassword" name="password" type="password" minlength="4" maxlength="30" autocomplete="current-password" required>
      <label for="versionFile">새 HTML 파일</label>
      <input id="versionFile" name="file" type="file" accept=".html,text/html" required>
      <p class="hint">기존 콘텐츠 정보는 유지하고 HTML만 새 버전으로 추가합니다.</p>
      <button id="versionSubmitButton" type="submit">새 버전 추가하기</button>
    </form>
    <div id="result" hidden aria-live="polite"></div>
  </section>
</main>
<script>
const createForm = document.getElementById('createForm');
const versionForm = document.getElementById('versionForm');
const createModeButton = document.getElementById('createModeButton');
const versionModeButton = document.getElementById('versionModeButton');
const cohortId = document.getElementById('cohortId');
const nameLabel = document.getElementById('nameLabel');
const nameInput = document.getElementById('ownerName');
const teamSelect = document.getElementById('team');
const createSubmitButton = document.getElementById('createSubmitButton');
const versionSubmitButton = document.getElementById('versionSubmitButton');
const result = document.getElementById('result');
let cohortOptions = [];

function updateNameField() {
  const teams = cohortOptions.find((cohort) => cohort.cohortId === cohortId.value)?.teamOptions;
  nameInput.value = '';
  teamSelect.value = '';
  const usesTeams = Array.isArray(teams) && teams.length > 0;
  nameLabel.textContent = usesTeams ? '팀' : '이름';
  nameLabel.htmlFor = usesTeams ? 'team' : 'ownerName';
  nameInput.hidden = usesTeams;
  nameInput.disabled = usesTeams;
  nameInput.required = !usesTeams;
  teamSelect.hidden = !usesTeams;
  teamSelect.disabled = !usesTeams;
  teamSelect.required = usesTeams;
  teamSelect.replaceChildren(new Option('팀을 선택하세요', ''));
  if (usesTeams) teams.forEach((team) => teamSelect.add(new Option(team, team)));
}

async function loadOptions() {
  try {
    const response = await fetch('/api/v2/cohorts');
    if (!response.ok) throw new Error('선택 목록 요청 실패');
    const cohortData = await response.json();
    cohortOptions = cohortData.cohorts;
    cohortId.replaceChildren(new Option('소속(수업)을 선택하세요', ''));
    cohortOptions.forEach((cohort) => cohortId.add(new Option(cohort.name, cohort.cohortId)));
    cohortId.disabled = false;
    createSubmitButton.disabled = false;
    const params = new URLSearchParams(location.search);
    const requestedCohortId = params.get('cohortId');
    const requestedCohortName = params.get('c');
    const requested = cohortOptions.find((cohort) => cohort.cohortId === requestedCohortId || cohort.name === requestedCohortName);
    if (requested) {
      cohortId.value = requested.cohortId;
      updateNameField();
    }
  } catch {
    cohortId.options[0].textContent = '선택 목록을 불러오지 못했습니다';
    result.hidden = false;
    result.className = 'error';
    result.textContent = '페이지를 새로고침해 다시 시도해 주세요.';
  }
}

cohortId.addEventListener('change', updateNameField);

function setMode(mode) {
  const creating = mode === 'create';
  createForm.hidden = !creating;
  versionForm.hidden = creating;
  createModeButton.setAttribute('aria-selected', String(creating));
  versionModeButton.setAttribute('aria-selected', String(!creating));
  result.hidden = true;
}
createModeButton.addEventListener('click', () => setMode('create'));
versionModeButton.addEventListener('click', () => setMode('version'));

createForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  result.hidden = false;
  result.className = '';
  result.textContent = '업로드 중...';
  createSubmitButton.disabled = true;
  try {
    const response = await fetch('/api/v2/contents', { method: 'POST', body: new FormData(createForm) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '업로드에 실패했습니다.');
    if (!data.content?.viewerUrl) throw new Error('콘텐츠 페이지 주소를 받지 못했습니다.');
    result.textContent = '배포 완료 — 콘텐츠 페이지로 이동합니다…';
    window.location.assign(data.content.viewerUrl);
  } catch (error) {
    result.className = 'error';
    result.textContent = error.message;
  } finally {
    createSubmitButton.disabled = false;
  }
});

versionForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  result.hidden = false;
  result.className = '';
  result.textContent = '새 버전을 추가하는 중...';
  versionSubmitButton.disabled = true;
  try {
    const contentId = versionForm.contentId.value.trim();
    const formData = new FormData();
    formData.set('password', versionForm.password.value);
    formData.set('file', versionForm.file.files[0]);
    const response = await fetch(`/api/v2/contents/${contentId}/versions`, { method: 'POST', body: formData });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '새 버전을 추가하지 못했습니다.');
    result.textContent = '업데이트 완료 — 콘텐츠 페이지로 이동합니다…';
    window.location.assign(data.content.viewerUrl);
  } catch (error) {
    result.className = 'error';
    result.textContent = error.message;
  } finally {
    versionSubmitButton.disabled = false;
  }
});

loadOptions();
</script>
<footer class="site-footer"><span>© NXT Cloud · AI 리터러시 콘텐츠 갤러리</span><a class="admin-link" href="/admin.html">관리자</a></footer>
</body>
</html>
