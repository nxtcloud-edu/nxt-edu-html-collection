<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/assets/theme.js"></script><link rel="icon" href="/assets/nxtcloud-logo.png?v=2"><title>콘텐츠 보기 · AI 콘텐츠 갤러리</title>
<style>:root{color-scheme:dark;--bg:#090a12;--panel:#15182b;--line:#343954;--text:#f4f6ff;--muted:#9ca3bd;--cyan:#00d2ff;--pink:#e94560}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}main{width:min(1180px,94vw);margin:auto;padding:var(--sp-8) 0 calc(var(--sp-8) + var(--sp-8) + var(--sp-4))}.site-tools a{display:inline-flex;align-items:center;height:40px;color:var(--muted);text-decoration:none}.site-tools a:hover{color:var(--cyan)}#likeButton{display:inline-flex;align-items:center;gap:var(--sp-2);min-height:40px;padding:var(--sp-2) var(--sp-4);border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit;font-weight:700;cursor:pointer}#likeButton:hover{border-color:var(--cyan)}#likeButton:disabled{opacity:.55;cursor:not-allowed}.topbar{display:flex;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap}.topbar a{color:var(--muted);text-decoration:none}.topbar a:hover{color:var(--cyan)}#updateButton{padding:var(--sp-2) var(--sp-4);border:0;border-radius:10px;background:var(--pink);color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.12)}#updateButton:hover{background:#ff5b75}.modal-content{padding:var(--sp-6)}#updateForm label{display:block;margin:var(--sp-4) 0 var(--sp-2);font-weight:700}#updateForm input{width:100%;padding:var(--sp-3);border:1px solid #555b78;background:#0d0f1b;color:var(--text);font:inherit}#updateForm .modal-actions{display:flex;gap:var(--sp-3);margin-top:var(--sp-4)}#updateForm button{padding:var(--sp-3) var(--sp-4);border:0;background:var(--pink);color:#fff;font:inherit;font-weight:800;cursor:pointer}#updateForm .cancel{background:#27304d}header{padding:var(--sp-8) 0 var(--sp-6)}h1{margin:0 0 var(--sp-4);font-size:clamp(30px,6vw,54px);letter-spacing:-.06em;overflow-wrap:anywhere}.meta{display:flex;gap:var(--sp-2) var(--sp-4);flex-wrap:wrap;color:var(--muted);font-size:13px}.viewer{border:1px solid var(--line);background:#000;box-shadow:0 18px 60px #0008}iframe{display:block;width:100%;height:min(72vh,760px);min-height:420px;border:0;background:#fff}.feedback{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(300px,1.2fr);gap:var(--sp-6);margin-top:var(--sp-8)}.panel{padding:var(--sp-6);border:1px solid var(--line);background:var(--panel)}h2{margin:0 0 var(--sp-6)}.panel label{display:block;margin:var(--sp-4) 0 var(--sp-2);font-weight:700}.panel input,.panel textarea{width:100%;padding:var(--sp-3);border:1px solid #555b78;background:#0d0f1b;color:var(--text);font:inherit}.panel textarea{min-height:130px;resize:vertical}.panel button{margin-top:var(--sp-4);padding:var(--sp-3) var(--sp-4);border:0;background:var(--pink);color:#fff;font:inherit;font-weight:800;cursor:pointer}.panel button:disabled{opacity:.55}.status{min-height:20px;margin:var(--sp-3) 0 0;color:var(--muted)}#feedbackList{display:grid;gap:var(--sp-3)}.feedback-item{padding:var(--sp-4);border:1px solid var(--line);background:#101222}.feedback-head{display:flex;justify-content:space-between;gap:var(--sp-3);color:var(--muted);font-size:12px}.feedback-item p{margin:var(--sp-3) 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.empty{color:var(--muted)}@media(max-width:760px){.feedback{grid-template-columns:1fr}iframe{min-height:58vh}}</style><link rel="stylesheet" href="/assets/theme.css"></head>
<body><span class="grid-twinkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><nav class="site-nav"><a class="site-brand" href="/"><img class="brand-logo" src="/assets/nxtcloud-logo.png?v=2" alt="NXT Cloud"><span class="site-brand-label">AI CONTENT GALLERY</span></a><div class="site-tools"><a href="/">← 갤러리</a><button class="theme-toggle" type="button" data-theme-toggle>🌙 다크</button></div></nav><main>
<div class="topbar"><button id="updateButton" type="button" hidden>파일 업데이트</button><a id="largeLink" href="#" target="_blank" rel="noopener">새 탭에서 크게 보기 ↗</a></div>
<header><h1 id="title">콘텐츠를 불러오는 중...</h1><div class="meta"><span id="owner"></span><span id="cohort"></span><span id="category"></span><span id="version"></span><time id="uploadedAt"></time></div><button id="likeButton" type="button">♥ 추천 <span id="likeCount">0</span></button></header>
<div class="viewer"><iframe id="contentFrame" title="콘텐츠 플레이 화면"></iframe></div>
<section class="feedback" aria-label="피드백">
<form id="feedbackForm" class="panel"><h2>피드백 남기기</h2><label for="nickname">닉네임 <small>(선택)</small></label><input id="nickname" name="nickname" maxlength="20" autocomplete="nickname" placeholder="비우면 익명"><label for="message">내용</label><textarea id="message" name="message" maxlength="500" required placeholder="좋았던 점이나 개선 아이디어를 남겨 주세요."></textarea><button id="submitButton" type="submit">피드백 등록</button><p id="status" class="status" aria-live="polite"></p></form>
<div class="panel"><h2>받은 피드백</h2><div id="feedbackList" aria-live="polite"><p class="empty">피드백을 불러오는 중...</p></div></div>
</section></main>
<dialog id="updateModal" aria-labelledby="updateModalTitle"><div class="modal-content"><h2 id="updateModalTitle">파일 업데이트</h2><form id="updateForm"><label for="updatePassword">소유 비밀번호</label><input id="updatePassword" name="password" type="password" minlength="4" maxlength="30" autocomplete="current-password" required><label for="updateFile">새 HTML 파일</label><input id="updateFile" name="file" type="file" accept=".html,text/html" required><p id="updateStatus" class="status" aria-live="polite"></p><div class="modal-actions"><button id="updateSubmit" type="submit">업데이트</button><button id="updateCancel" class="cancel" type="button">취소</button></div></form></div></dialog>
<script>
const contentId=new URLSearchParams(location.search).get('id')||'';const idPattern=/^[0-9a-f]{8}$/;const title=document.getElementById('title'),owner=document.getElementById('owner'),cohort=document.getElementById('cohort'),category=document.getElementById('category'),version=document.getElementById('version'),uploadedAt=document.getElementById('uploadedAt'),frame=document.getElementById('contentFrame'),largeLink=document.getElementById('largeLink'),likeButton=document.getElementById('likeButton'),likeCount=document.getElementById('likeCount'),form=document.getElementById('feedbackForm'),list=document.getElementById('feedbackList'),status=document.getElementById('status'),submitButton=document.getElementById('submitButton'),updateButton=document.getElementById('updateButton'),updateModal=document.getElementById('updateModal'),updateForm=document.getElementById('updateForm'),updateStatus=document.getElementById('updateStatus'),updateSubmit=document.getElementById('updateSubmit'),updateCancel=document.getElementById('updateCancel');let currentGame=null;
function formatDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?'업데이트 시각 알 수 없음':new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(date)}
function renderFeedback(items){list.replaceChildren();if(!items.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='아직 피드백이 없어요. 첫 의견을 남겨 보세요!';list.append(empty);return}items.forEach(item=>{const article=document.createElement('article'),head=document.createElement('div'),name=document.createElement('strong'),time=document.createElement('time'),message=document.createElement('p');article.className='feedback-item';head.className='feedback-head';name.textContent=item.nickname;time.dateTime=item.createdAt;time.textContent=formatDate(item.createdAt);message.textContent=item.message;head.append(name,time);article.append(head,message);list.append(article)})}
async function loadFeedback(){const response=await fetch(`/api/feedback?id=${contentId}`);if(!response.ok)throw new Error('피드백을 불러오지 못했습니다.');renderFeedback((await response.json()).feedback)}
async function init(){if(!idPattern.test(contentId)){title.textContent='콘텐츠를 찾을 수 없습니다.';form.hidden=true;list.replaceChildren();return}try{const response=await fetch(`/api/content?id=${contentId}`);if(!response.ok)throw new Error();const game=(await response.json()).content;currentGame=game;updateButton.hidden=false;frame.src=game.contentUrl;largeLink.href=game.contentUrl;frame.addEventListener('load',()=>frame.contentWindow?.focus());title.textContent=game.title||game.name;owner.textContent=game.name;cohort.textContent=game.affiliation;category.textContent=game.category;version.textContent=`v${game.latestVersion} · 업데이트`;uploadedAt.dateTime=game.updatedAt;uploadedAt.textContent=formatDate(game.updatedAt);likeCount.textContent=game.likes;likeButton.disabled=localStorage.getItem(`liked:${contentId}`)==='1';await loadFeedback()}catch{title.textContent='콘텐츠 정보를 불러오지 못했습니다.';list.replaceChildren();const error=document.createElement('p');error.className='empty';error.textContent='잠시 후 다시 시도해 주세요.';list.append(error)}}
likeButton.addEventListener('click',async()=>{likeButton.disabled=true;try{const response=await fetch('/api/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contentId})});if(!response.ok)throw new Error();likeCount.textContent=(await response.json()).likes;localStorage.setItem(`liked:${contentId}`,'1')}catch{likeButton.disabled=false}});
form.addEventListener('submit',async event=>{event.preventDefault();submitButton.disabled=true;status.textContent='등록 중...';try{const response=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contentId,nickname:form.nickname.value,message:form.message.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'등록하지 못했습니다.');form.message.value='';status.textContent='피드백을 등록했습니다.';await loadFeedback()}catch(error){status.textContent=error.message}finally{submitButton.disabled=false}});
updateButton.addEventListener('click',()=>{updateForm.reset();updateStatus.textContent='';updateModal.showModal()});
updateCancel.addEventListener('click',()=>updateModal.close());
updateForm.addEventListener('submit',async event=>{event.preventDefault();if(!currentGame)return;updateSubmit.disabled=true;updateStatus.textContent='업데이트 중...';try{const formData=new FormData();formData.set('affiliation',currentGame.affiliation);formData.set('category',currentGame.category);formData.set('name',currentGame.name);formData.set('title',currentGame.title||currentGame.name);formData.set('password',updateForm.password.value);formData.set('file',updateForm.file.files[0]);const response=await fetch('/api/upload',{method:'POST',body:formData});const data=await response.json();if(!response.ok)throw new Error(data.error||'업데이트에 실패했습니다.');updateStatus.textContent='업데이트 완료 — 새로고침합니다…';updateModal.close();window.location.reload()}catch(error){updateStatus.textContent=error.message;updateSubmit.disabled=false}});
init();
</script><footer class="site-footer"><span>© NXT Cloud · AI 리터러시 콘텐츠 갤러리</span><a class="admin-link" href="/admin.html">관리자</a></footer></body></html>
